<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1f0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Ask questions about your notes: typed, scanned or handwritten. Every answer says how sure it is and where it came from.">
  <title>DocBlendAI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317806f'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-style='italic' font-size='20' text-anchor='middle' fill='%23fff'%3Ed%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Theme before first paint (no flash): the saved choice, else the device setting.
    try {
      var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = t;
      if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#191d1f");
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>DocBlendAI needs JavaScript turned on.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
